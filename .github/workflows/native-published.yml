name: Native validation of published 1.3.1 assets

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-published-131-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos-arm64:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the workflow and verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check out the exact published source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: v1.3.1
          path: qa-source
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.19.0
          run_install: false
      - name: Verify native runner and exact source identity
        id: source
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          translated="$(sysctl -n sysctl.proc_translated 2>/dev/null || echo 0)"
          test "$translated" != 1
          test "$(node -p 'process.arch')" = arm64
          test "$(git -C qa-source rev-parse HEAD)" = 83ba92241dc94dd9ce307217096f254cb86bd289
          test "$(node -p "require('./qa-source/package.json').version")" = 1.3.1
          sw_vers
          echo "source_sha=$(git -C qa-source rev-parse HEAD)"
          echo "node_arch=$(node -p 'process.arch')"
      - name: Install the published source's locked QA dependencies
        id: deps
        working-directory: qa-source/
        run: pnpm install --frozen-lockfile
      - name: Download the published macOS asset and checksum
        env:
          TRACE_ASSET_DIR: ${{ runner.temp }}/trace-published-131-mac
        run: |
          set -euo pipefail
          mkdir -p "$TRACE_ASSET_DIR"
          for name in TRACE-Boardviewer-1.3.1-mac-arm64.zip TRACE-Boardviewer-1.3.1-mac-arm64.zip.sha256; do
            curl --fail --location --silent --show-error --retry 2 --max-time 240 \
              "https://github.com/trace-boardviewer/trace-boardviewer/releases/download/v1.3.1/$name" \
              --output "$TRACE_ASSET_DIR/$name"
          done
          echo "TRACE_ASSET_DIR=$TRACE_ASSET_DIR" >> "$GITHUB_ENV"
      - name: Verify published digest, size and sidecar contents
        id: assets
        run: node .github/scripts/verify-published-assets.cjs "--platform=mac" "--directory=$TRACE_ASSET_DIR" "--out=$RUNNER_TEMP/native-published-131-mac/assets.json"
      - name: Extract the verified ZIP without changing its bytes
        id: extract
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-published-131-mac/extracted"
          ditto -x -k "$TRACE_ASSET_DIR/TRACE-Boardviewer-1.3.1-mac-arm64.zip" "$RUNNER_TEMP/native-published-131-mac/extracted"
          app="$RUNNER_TEMP/native-published-131-mac/extracted/TRACE Boardviewer.app"
          test -x "$app/Contents/MacOS/TRACE Boardviewer"
          test -f "$app/Contents/Resources/app.asar"
          echo "TRACE_APP=$app" >> "$GITHUB_ENV"
      - name: Run the native macOS smoke test on the published ZIP
        if: always() && !cancelled() && steps.source.outcome == 'success' && steps.deps.outcome == 'success' && steps.assets.outcome == 'success' && steps.extract.outcome == 'success'
        timeout-minutes: 20
        working-directory: qa-source
        run: node scripts/mac-smoke.cjs --app "$TRACE_APP" --arch arm64 --commit 83ba92241dc94dd9ce307217096f254cb86bd289 --artifact "$TRACE_ASSET_DIR/TRACE-Boardviewer-1.3.1-mac-arm64.zip" --out "$RUNNER_TEMP/native-published-131-mac/mac-smoke.json"
      - name: Inspect fuse bytes in the published ZIP executable
        if: always() && !cancelled() && steps.source.outcome == 'success' && steps.deps.outcome == 'success' && steps.assets.outcome == 'success' && steps.extract.outcome == 'success'
        working-directory: qa-source
        run: node -e 'require("./scripts/packaged-functional-qa.cjs").inspectFuses(process.argv[1]).then(() => console.log("Published macOS executable fuse bytes match the configured values.")).catch(() => { console.error("Published macOS executable fuse bytes do not match the configured values."); process.exitCode = 1; })' "$TRACE_APP/Contents/MacOS/TRACE Boardviewer"
      - name: Run the full packaged functional suite on the published ZIP
        if: always() && !cancelled() && steps.source.outcome == 'success' && steps.deps.outcome == 'success' && steps.assets.outcome == 'success' && steps.extract.outcome == 'success'
        timeout-minutes: 30
        working-directory: qa-source
        run: |
          set -euo pipefail
          node scripts/packaged-functional-qa.cjs \
            "--executable=$TRACE_APP/Contents/MacOS/TRACE Boardviewer" \
            "--asar=$TRACE_APP/Contents/Resources/app.asar" \
            "--artifact=$TRACE_ASSET_DIR/TRACE-Boardviewer-1.3.1-mac-arm64.zip" \
            "--checksum=$TRACE_ASSET_DIR/TRACE-Boardviewer-1.3.1-mac-arm64.zip.sha256" \
            --version=1.3.1 --os=darwin --arch=arm64 \
            --out="$RUNNER_TEMP/native-published-131-mac/packaged-functional.json"
      - name: Validate complete macOS QA evidence
        if: always()
        working-directory: qa-source
        run: |
          set -euo pipefail
          node scripts/validate-packaged-functional-evidence.cjs \
            --report "$RUNNER_TEMP/native-published-131-mac/packaged-functional.json" \
            --screenshots "$RUNNER_TEMP/native-published-131-mac/packaged-functional-screenshots"
          test -s "$RUNNER_TEMP/native-published-131-mac/assets.json"
          test -s "$RUNNER_TEMP/native-published-131-mac/mac-smoke.json"
      - name: Upload macOS native evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-published-131-macos-arm64
          path: |
            ${{ runner.temp }}/native-published-131-mac/assets.json
            ${{ runner.temp }}/native-published-131-mac/mac-smoke.json
            ${{ runner.temp }}/native-published-131-mac/packaged-functional.json
            ${{ runner.temp }}/native-published-131-mac/packaged-functional-screenshots/*.png
          if-no-files-found: warn
          retention-days: 14

  linux-x64:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the workflow and verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check out the exact published source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: v1.3.1
          path: qa-source
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.19.0
          run_install: false
      - name: Install Linux smoke-test tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fuse3 x11-utils xdotool desktop-file-utils xvfb xauth imagemagick
      - name: Verify native runner and exact source identity
        id: source
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          test "$(node -p 'process.arch')" = x64
          test "$(git -C qa-source rev-parse HEAD)" = 83ba92241dc94dd9ce307217096f254cb86bd289
          test "$(node -p "require('./qa-source/package.json').version")" = 1.3.1
          uname -a
          cat /etc/os-release
          echo "source_sha=$(git -C qa-source rev-parse HEAD)"

      - name: Download the published Linux assets and checksums
        id: download
        env:
          TRACE_ASSET_DIR: ${{ runner.temp }}/trace-published-131-linux
        run: |
          set -euo pipefail
          mkdir -p "$TRACE_ASSET_DIR"
          for name in \
            TRACE-Boardviewer-1.3.1-linux-amd64.deb \
            TRACE-Boardviewer-1.3.1-linux-amd64.deb.sha256 \
            TRACE-Boardviewer-1.3.1-linux-x86_64.AppImage \
            TRACE-Boardviewer-1.3.1-linux-x86_64.AppImage.sha256; do
            curl --fail --location --silent --show-error --retry 2 --max-time 240 \
              "https://github.com/trace-boardviewer/trace-boardviewer/releases/download/v1.3.1/$name" \
              --output "$TRACE_ASSET_DIR/$name"
          done
          echo "TRACE_ASSET_DIR=$TRACE_ASSET_DIR" >> "$GITHUB_ENV"
      - name: Verify published digests, sizes and sidecar contents
        id: assets
        run: node .github/scripts/verify-published-assets.cjs "--platform=linux" "--directory=$TRACE_ASSET_DIR" "--out=$RUNNER_TEMP/native-published-131-linux/assets.json"
      - name: Extract the verified AppImage for parity inspection
        id: extract
        run: |
          set -euo pipefail
          image="$TRACE_ASSET_DIR/TRACE-Boardviewer-1.3.1-linux-x86_64.AppImage"
          chmod +x "$image"
          mkdir -p "$RUNNER_TEMP/native-published-131-linux/appimage-extract"
          (cd "$RUNNER_TEMP/native-published-131-linux/appimage-extract" && "$image" --appimage-extract >/dev/null)
          test -x "$RUNNER_TEMP/native-published-131-linux/appimage-extract/squashfs-root/trace-boardviewer"
          echo "TRACE_APPIMAGE=$image" >> "$GITHUB_ENV"
          echo "TRACE_UNPACKED=$RUNNER_TEMP/native-published-131-linux/appimage-extract/squashfs-root" >> "$GITHUB_ENV"
      - name: Install the published source's locked QA dependencies
        id: deps
        working-directory: qa-source
        run: pnpm install --frozen-lockfile
      - name: Check static package layout, fuses and ASAR parity
        if: always() && !cancelled() && steps.source.outcome == 'success' && steps.deps.outcome == 'success' && steps.assets.outcome == 'success' && steps.extract.outcome == 'success'
        working-directory: qa-source
        run: |
          set -euo pipefail
          node scripts/linux-smoke.cjs static \
            --appimage "$TRACE_APPIMAGE" \
            --deb "$TRACE_ASSET_DIR/TRACE-Boardviewer-1.3.1-linux-amd64.deb" \
            --unpacked "$TRACE_UNPACKED" --arch x64 --commit 83ba92241dc94dd9ce307217096f254cb86bd289 \
            --out "$RUNNER_TEMP/native-published-131-linux/linux-static.json"
      - name: Install the exact published DEB in the disposable runner
        id: install-deb
        if: always() && !cancelled() && steps.source.outcome == 'success' && steps.deps.outcome == 'success' && steps.assets.outcome == 'success'
        run: sudo apt-get install -y --no-install-recommends "$TRACE_ASSET_DIR/TRACE-Boardviewer-1.3.1-linux-amd64.deb"
      - name: Record the runner namespace setting before sandbox scenarios
        id: linux-sysctl
        if: always() && !cancelled() && steps.source.outcome == 'success' && steps.deps.outcome == 'success' && steps.assets.outcome == 'success'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-published-131-linux"
          sysctl -n kernel.apparmor_restrict_unprivileged_userns > "$RUNNER_TEMP/native-published-131-linux/sysctl-original"
          case "$(cat "$RUNNER_TEMP/native-published-131-linux/sysctl-original")" in 0|1) ;; *) echo 'Unexpected AppArmor user-namespace setting.' >&2; exit 1 ;; esac
          cat "$RUNNER_TEMP/native-published-131-linux/sysctl-original"
      - name: Smoke-test the installed DEB with its sandbox on (S1)
        id: smoke-deb
        if: always() && !cancelled() && steps.source.outcome == 'success' && steps.deps.outcome == 'success' && steps.assets.outcome == 'success' && steps.install-deb.outcome == 'success' && steps.linux-sysctl.outcome == 'success'
        timeout-minutes: 15
        working-directory: qa-source
        run: |
          set -euo pipefail
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=1
          test -f /etc/apparmor.d/trace-boardviewer
          sudo cat /sys/kernel/security/apparmor/profiles | grep -F 'trace-boardviewer (unconfined)'
          xvfb-run -a -s '-screen 0 1600x1000x24' node scripts/linux-smoke.cjs run \
            --scenario S1 --target installed --arch x64 --userns restricted \
            --expect-sandbox on --expect-gate no --commit 83ba92241dc94dd9ce307217096f254cb86bd289 \
            --out "$RUNNER_TEMP/native-published-131-linux/smoke-S1-deb.json"
      - name: Run full functional QA against the installed DEB under S1
        if: always() && !cancelled() && steps.source.outcome == 'success' && steps.deps.outcome == 'success' && steps.assets.outcome == 'success' && steps.install-deb.outcome == 'success' && steps.linux-sysctl.outcome == 'success'
        timeout-minutes: 30
        working-directory: qa-source
        run: |
          set -euo pipefail
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=1
          test -x "/opt/TRACE Boardviewer/trace-boardviewer"
          test -f "/opt/TRACE Boardviewer/resources/app.asar"
          deb="$TRACE_ASSET_DIR/TRACE-Boardviewer-1.3.1-linux-amd64.deb"
          xvfb-run -a -s '-screen 0 1600x1000x24' node scripts/packaged-functional-qa.cjs \
            --executable="/opt/TRACE Boardviewer/trace-boardviewer" \
            --asar="/opt/TRACE Boardviewer/resources/app.asar" \
            "--artifact=$deb" "--checksum=$deb.sha256" \
            --version=1.3.1 --os=linux --arch=x64 \
            --out="$RUNNER_TEMP/native-published-131-linux/packaged-functional-deb.json"
      - name: Smoke-test the AppImage under restricted-userns consent (S2)
        if: always() && !cancelled() && steps.source.outcome == 'success' && steps.deps.outcome == 'success' && steps.assets.outcome == 'success' && steps.extract.outcome == 'success' && steps.linux-sysctl.outcome == 'success'
        timeout-minutes: 15
        working-directory: qa-source
        run: |
          set -euo pipefail
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=1
          xvfb-run -a -s '-screen 0 1600x1000x24' node scripts/linux-smoke.cjs run \
            --scenario S2 --target appimage --appimage "$TRACE_APPIMAGE" --arch x64 --userns restricted \
            --expect-sandbox off --expect-gate yes --commit 83ba92241dc94dd9ce307217096f254cb86bd289 \
            --out "$RUNNER_TEMP/native-published-131-linux/smoke-S2-appimage.json"
      - name: Smoke-test the AppImage with its sandbox on (S3)
        if: always() && !cancelled() && steps.source.outcome == 'success' && steps.deps.outcome == 'success' && steps.assets.outcome == 'success' && steps.extract.outcome == 'success' && steps.linux-sysctl.outcome == 'success'
        timeout-minutes: 15
        working-directory: qa-source
        run: |
          set -euo pipefail
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          xvfb-run -a -s '-screen 0 1600x1000x24' node scripts/linux-smoke.cjs run \
            --scenario S3 --target appimage --appimage "$TRACE_APPIMAGE" --arch x64 --userns allowed \
            --expect-sandbox on --expect-gate no --commit 83ba92241dc94dd9ce307217096f254cb86bd289 \
            --out "$RUNNER_TEMP/native-published-131-linux/smoke-S3-appimage.json"
      - name: Run full functional QA against the published AppImage under S3
        if: always() && !cancelled() && steps.source.outcome == 'success' && steps.deps.outcome == 'success' && steps.assets.outcome == 'success' && steps.extract.outcome == 'success' && steps.linux-sysctl.outcome == 'success'
        timeout-minutes: 30
        working-directory: qa-source
        run: |
          set -euo pipefail
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          xvfb-run -a -s '-screen 0 1600x1000x24' node scripts/packaged-functional-qa.cjs \
            "--executable=$TRACE_APPIMAGE" \
            "--asar=$TRACE_UNPACKED/resources/app.asar" \
            "--artifact=$TRACE_APPIMAGE" "--checksum=$TRACE_APPIMAGE.sha256" \
            --version=1.3.1 --os=linux --arch=x64 \
            --out="$RUNNER_TEMP/native-published-131-linux/packaged-functional-appimage.json"
      - name: Restore the runner's default namespace restriction
        if: always()
        run: |
          if [ -s "$RUNNER_TEMP/native-published-131-linux/sysctl-original" ]; then
            value="$(cat "$RUNNER_TEMP/native-published-131-linux/sysctl-original")"
            case "$value" in 0|1) sudo sysctl -w "kernel.apparmor_restrict_unprivileged_userns=$value" ;; *) echo 'Invalid saved AppArmor namespace setting.' >&2; exit 1 ;; esac
          fi
      - name: Validate Linux functional evidence manifests
        if: always()
        working-directory: qa-source
        run: |
          set -euo pipefail
          status=0
          node scripts/validate-packaged-functional-evidence.cjs \
            --report "$RUNNER_TEMP/native-published-131-linux/packaged-functional-deb.json" \
            --screenshots "$RUNNER_TEMP/native-published-131-linux/packaged-functional-deb-screenshots" || status=1
          node scripts/validate-packaged-functional-evidence.cjs \
            --report "$RUNNER_TEMP/native-published-131-linux/packaged-functional-appimage.json" \
            --screenshots "$RUNNER_TEMP/native-published-131-linux/packaged-functional-appimage-screenshots" || status=1
          for evidence in assets.json linux-static.json smoke-S1-deb.json smoke-S2-appimage.json smoke-S3-appimage.json; do
            test -s "$RUNNER_TEMP/native-published-131-linux/$evidence" || status=1
          done
          exit "$status"
      - name: Upload Linux native evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-published-131-linux-x64
          path: |
            ${{ runner.temp }}/native-published-131-linux/assets.json
            ${{ runner.temp }}/native-published-131-linux/linux-static.json
            ${{ runner.temp }}/native-published-131-linux/smoke-*.json
            ${{ runner.temp }}/native-published-131-linux/packaged-functional-deb.json
            ${{ runner.temp }}/native-published-131-linux/packaged-functional-appimage.json
            ${{ runner.temp }}/native-published-131-linux/packaged-functional-deb-screenshots/*.png
            ${{ runner.temp }}/native-published-131-linux/packaged-functional-appimage-screenshots/*.png
          if-no-files-found: warn
          retention-days: 14
