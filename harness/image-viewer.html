<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- No CSP on purpose: hostile-SVG QA must prove the sanitizer, not the policy, keeps requests and scripts out. -->
  <title>Image viewer harness</title>
  <style>
    .harness { display: flex; flex-direction: column; height: 100%; }
    .harness-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 6px 12px; background: var(--panel); border-bottom: 1px solid var(--line); font-size: 12px; color: var(--muted); }
    .harness-bar select, .harness-bar button { height: 26px; padding: 0 8px; border-radius: 6px; background: var(--raised); color: var(--text); border: 1px solid var(--line); }
    .harness-bar label { display: inline-flex; align-items: center; gap: 6px; }
    .harness-view { flex: 1; min-height: 0; }
    body[data-chrome=off] .harness-bar { display: none; }
  </style>
</head>
<body><div id="root"></div><script type="module" src="./image-viewer.tsx"></script></body>
</html>
